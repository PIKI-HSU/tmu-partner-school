      <circle cx="56" cy="64" r="34" fill="#fff0ed"/>
      <text x="56" y="75" text-anchor="middle" font-size="25" font-weight="900" fill="#e95d43">Care</text>
      <text x="108" y="52" font-size="25" font-weight="900" fill="#182231">智齡科技</text>
      <text x="108" y="88" font-size="17" fill="#5b6776">智慧用藥、高齡健康與決策支援</text>
