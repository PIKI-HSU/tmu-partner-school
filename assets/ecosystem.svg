      <text x="56" y="75" text-anchor="middle" font-size="26" font-weight="900" fill="#008f95">AI</text>
      <text x="108" y="52" font-size="25" font-weight="900" fill="#182231">AI 藥物結構開發</text>
      <text x="108" y="88" font-size="17" fill="#5b6776">化合物設計、活性預測與 ADMET 評估</text>
    </g>
    <g transform="translate(690 74)">
      <rect width="318" height="130" rx="18" fill="#fff" stroke="#dce3e8" filter="url(#shadow)"/>
      <circle cx="56" cy="64" r="34" fill="#eef6ec"/>
      <text x="56" y="75" text-anchor="middle" font-size="25" font-weight="900" fill="#6fa66f">Ab</text>
      <text x="108" y="52" font-size="25" font-weight="900" fill="#182231">蛋白質藥物開發</text>
      <text x="108" y="88" font-size="17" fill="#5b6776">抗體、重組蛋白與結構生物學應用</text>
    </g>
    <g transform="translate(92 514)">
      <rect width="318" height="130" rx="18" fill="#fff" stroke="#dce3e8" filter="url(#shadow)"/>
      <circle cx="56" cy="64" r="34" fill="#fff3df"/>
      <text x="56" y="75" text-anchor="middle" font-size="25" font-weight="900" fill="#c98300">Dx</text>
      <text x="108" y="52" font-size="25" font-weight="900" fill="#182231">智慧精準檢測</text>
      <text x="108" y="88" font-size="17" fill="#5b6776">基因檢測、多體學與臨床大數據</text>
