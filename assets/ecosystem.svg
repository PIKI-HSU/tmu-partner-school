<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">智慧健康人才培育生態圖</title>
  <desc id="desc">以 AI 藥物開發、蛋白質藥物開發、智慧精準檢測與智齡科技，串聯教育、研發、產業與創業。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfa"/>
      <stop offset="1" stop-color="#fff7eb"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a6a6"/>
      <stop offset="1" stop-color="#174d7c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172232" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1100" height="720" rx="26" fill="url(#bg)"/>
  <g transform="translate(550 355)">
