        <path d="M92 0 H164" stroke="#f5b63f"/>
        <path d="M184 0 H256" stroke="#6fa66f"/>
        <path d="M276 0 H348" stroke="#e95d43"/>
      </g>
      <g transform="translate(42 144)" font-size="15" font-weight="800" fill="#fff">
