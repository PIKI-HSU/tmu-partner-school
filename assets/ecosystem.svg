    <circle r="118" fill="#eaf6f4"/>
    <circle r="58" fill="url(#teal)"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Microsoft JhengHei, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">TMU</text>
    <text x="0" y="25" text-anchor="middle" font-family="Microsoft JhengHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">精準醫療</text>
    <path d="M-18 64 C-72 114 -112 160 -154 228" stroke="#00a6a6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M18 64 C72 114 112 160 154 228" stroke="#e95d43" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-72 -106 C-160 -132 -250 -138 -338 -96" stroke="#f5b63f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M72 -106 C160 -132 250 -138 338 -96" stroke="#6fa66f" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <g font-family="Microsoft JhengHei, Arial, sans-serif">
