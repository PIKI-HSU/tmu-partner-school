<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">四大核心課程模組</title>
  <desc id="desc">AI 驅動藥物設計與精準醫療、智齡智慧化用藥與管理、產業鏈結與跨域實務實習、生醫創新創業與產品商品化。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#172232" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1040" height="520" rx="24" fill="#ffffff"/>
  <g font-family="Microsoft JhengHei, Arial, sans-serif">
    <text x="520" y="62" text-anchor="middle" font-size="34" font-weight="900" fill="#182231">四大核心課程模組</text>
    <text x="520" y="99" text-anchor="middle" font-size="18" fill="#5b6776">以問題導向與產業場域串接專業、數位能力與創業實作</text>
    <g transform="translate(76 150)">
      <rect width="204" height="250" rx="18" fill="#eaf6f4" stroke="#b9ddda" filter="url(#shadow)"/>
      <circle cx="102" cy="64" r="36" fill="#008f95"/>
      <text x="102" y="76" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">AI</text>
      <text x="102" y="132" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">AI 藥物設計</text>
      <text x="102" y="162" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">與精準醫療</text>
      <text x="102" y="204" text-anchor="middle" font-size="16" fill="#5b6776">小分子、生物製劑</text>
      <text x="102" y="229" text-anchor="middle" font-size="16" fill="#5b6776">基因分析與多體學</text>
    </g>
    <g transform="translate(306 150)">
      <rect width="204" height="250" rx="18" fill="#fff4e3" stroke="#f3d49a" filter="url(#shadow)"/>
      <circle cx="102" cy="64" r="36" fill="#f5b63f"/>
      <text x="102" y="76" text-anchor="middle" font-size="27" font-weight="900" fill="#182231">Rx</text>
      <text x="102" y="132" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">智齡智慧化</text>
      <text x="102" y="162" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">用藥與管理</text>
      <text x="102" y="204" text-anchor="middle" font-size="16" fill="#5b6776">用藥安全、決策支援</text>
      <text x="102" y="229" text-anchor="middle" font-size="16" fill="#5b6776">高齡健康情境</text>
    </g>
    <g transform="translate(536 150)">
      <rect width="204" height="250" rx="18" fill="#eef6ec" stroke="#c8dfc2" filter="url(#shadow)"/>
      <circle cx="102" cy="64" r="36" fill="#6fa66f"/>
      <text x="102" y="76" text-anchor="middle" font-size="27" font-weight="900" fill="#fff">Lab</text>
      <text x="102" y="132" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">產業鏈結</text>
      <text x="102" y="162" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">跨域實務</text>
      <text x="102" y="204" text-anchor="middle" font-size="16" fill="#5b6776">企業導師、參訪</text>
      <text x="102" y="229" text-anchor="middle" font-size="16" fill="#5b6776">國內外見實習</text>
    </g>
    <g transform="translate(766 150)">
      <rect width="204" height="250" rx="18" fill="#fff0ed" stroke="#f3c4b9" filter="url(#shadow)"/>
      <circle cx="102" cy="64" r="36" fill="#e95d43"/>
      <text x="102" y="76" text-anchor="middle" font-size="27" font-weight="900" fill="#fff">Go</text>
      <text x="102" y="132" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">生醫創新創業</text>
      <text x="102" y="162" text-anchor="middle" font-size="23" font-weight="900" fill="#182231">產品商品化</text>
      <text x="102" y="204" text-anchor="middle" font-size="16" fill="#5b6776">智財、法規、募資</text>
      <text x="102" y="229" text-anchor="middle" font-size="16" fill="#5b6776">Demo Day 與展會</text>
    </g>
    <path d="M280 276 H306 M510 276 H536 M740 276 H766" stroke="#9aa7b3" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
